<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

.header{
background:#007bff;
color:white;
padding:15px;
font-size:22px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
font-size:20px;
}

button{
width:100%;
padding:15px;
background:red;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="header">
SMC Management System
</div>

<div class="container">

<div class="card">👷 Labour</div>

<div class="card">👔 Staff</div>

<div class="card">📅 Attendance</div>

<div class="card">💰 Salary</div>

<div class="card">📦 Maal</div>

<button onclick="logout()">
Logout
</button>

</div>

<script>
function logout(){
window.location.href="index.html";
}
</script>

</body>
</html>
