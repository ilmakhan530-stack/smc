<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC V2 Login</title>

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="login-box">

<div class="logo">
<h1>SMC</h1>
<p>Management System</p>
</div>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<p class="footer">

Powered by Firebase

</p>

</div>

<script type="module" src="js/firebase-config.js"></script>

<script type="module" src="js/auth.js"></script>

</body>

</html>
